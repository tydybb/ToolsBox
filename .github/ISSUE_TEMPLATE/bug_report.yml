name: 问题反馈
description: 报告可以复现的错误或异常行为。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        疑似安全漏洞请先阅读 [安全报告说明](https://github.com/tydybb/ToolsBox/security/policy)，不要公开漏洞详情。
        请勿上传真实钉钉数据库、聊天记录、Cookie、账号资料、访问令牌或密码；日志、截图与网址也应脱敏。
  - type: input
    id: version
    attributes:
      label: 工具箱版本或提交
      description: 可在主窗口查看版本；源码运行请填写提交哈希。
      placeholder: v年.月.日.修订号 / 提交哈希
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 填写 Windows 版本、系统架构、显示缩放、明暗主题，以及内置 .NET / 依赖 Runtime / 源码运行。网页或打卡问题可补充相关组件版本，无需填写账号。
      placeholder: Windows 11，x64，125%，深色，内置 .NET 发布包
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从打开哪个工具开始描述；使用合成数据、临时文件或自建进程复现。
      placeholder: |
        1. 打开……
        2. 输入或点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 预期与实际结果
      description: 请提供完整错误文字、出现频率，以及是否每次都能复现。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图（可选）
      description: 遮盖用户名、文件路径中的个人信息、聊天内容、Cookie、令牌与敏感 URL 参数，不要附原始数据库或浏览器配置。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认内容和附件不含真实聊天、钉钉数据库、Cookie 或其他凭据。
          required: true
