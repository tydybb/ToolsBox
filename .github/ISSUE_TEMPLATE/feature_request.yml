name: 功能建议
description: 描述希望解决的具体使用问题。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue。建议中不要包含真实钉钉数据库、聊天内容、Cookie、密码或其他凭据；使用合成样例即可。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 当前在哪个工具、什么场景下遇到困难？现有行为有什么限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 描述操作和结果；如果涉及界面，可附不含个人信息的草图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案（可选）
  - type: textarea
    id: acceptance
    attributes:
      label: 如何验收（可选）
      description: 给出可观察的结果、适用 Windows 版本，以及权限或外部组件约束。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认内容和附件不含个人敏感信息或凭据。
          required: true
